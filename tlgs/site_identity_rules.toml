format = 1

[[rules]]
name = "tilde-users"
hosts = ["*"]
path_prefix = "/~"
site_key = "{origin}/~{segment}"

[[rules]]
name = "user-directories"
hosts = ["*"]
path_prefix = "/user/"
site_key = "{origin}/user/{segment}"

[[rules]]
name = "sdf-users"
hosts = ["sdf.org"]
path_prefix = "/"
site_key = "{origin}/{segment}"

[[tests]]
url = "gemini://example.org/~alice/post.gmi"
site_key = "gemini://example.org/~alice"

[[tests]]
url = "gemini://example.org/user/bob/"
site_key = "gemini://example.org/user/bob"

[[tests]]
url = "gemini://sdf.org/carol/log/"
site_key = "gemini://sdf.org/carol"

[[tests]]
url = "gemini://example.org/docs/"
site_key = "gemini://example.org"
